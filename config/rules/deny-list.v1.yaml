# Kinds `test_vector` and `documentation` are rejected at extraction time (reason `documentation_example`,
# packages/address-extractor); every kind is excluded by rule A8 (packages/labels). EVM entries apply to every EVM
# network. Only public specifications and documentation pages are listed here — never persons.

