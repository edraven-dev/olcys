        originGroup: 'acct:tablica:fikcyjny_kacper'
        identity:
          - { feature: contact_email_match, grade: B }
          - { feature: exact_username_or_name, grade: A }
          - { feature: exact_username_or_name, grade: A }
          - { feature: exact_username_or_name, grade: A }
        address:
          - { feature: e3_ownership_cue, grade: C }
      - anchor: false
        service: wykop
        originGroup: 'acct:wykop:fikcyjny_kacper'
