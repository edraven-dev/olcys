# Persona sanity set (synthetic): engine-level paths of the demo persona and of the methodology's worked example.
# `expected` is the score the current engine produces for these paths with the current weights (fixtures/persona/
# manifest.json, docs/methodology/wskaznik-pewnosci.md); a change to weights or algorithm that moves one of them
# must be a deliberate, documented decision.
version: persona.v1
cases:
  - id: BTC-1
    expected: 99
    relation: SELF_DECLARED
    paths:
      - anchor: true
        service: bitcointalk
        originGroup: 'acct:bitcointalk:900001'
        address:
          - { feature: e1_cryptographic_binding, grade: A }
          - { feature: e2_self_assertion, grade: B }
  - id: TRON-1
